<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Girraj Government College - Results</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Segoe UI", Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(
                rgba(0, 60, 90, 0.85),
                rgba(0, 60, 90, 0.85)
            ),
            url("https://www.transparenttextures.com/patterns/asfalt-dark.png");
            background-size: cover;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #ffffff;
        }

        .container {
            width: 90%;
            max-width: 900px;
            text-align: center;
        }

        .logo {
            width: 80px;
            margin-bottom: 15px;
        }

        h1 {
            font-size: 28px;
            letter-spacing: 1px;
            margin-bottom: 5px;
        }

        h2 {
            font-size: 20px;
            font-weight: normal;
            margin-bottom: 25px;
        }

        .subtitle {
            font-size: 14px;
            letter-spacing: 1px;
            margin-bottom: 35px;
            opacity: 0.9;
        }

        .batch-buttons {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 20px;
            justify-content: center;
        }

        .batch-buttons a {
            text-decoration: none;
            background: #ffffff;
            color: #003c5a;
            padding: 18px 10px;
            font-weight: 600;
            border-radius: 3px;
            transition: all 0.3s ease;
        }

        .batch-buttons a:hover {
            background: #e3f1f7;
            transform: translateY(-3px);
        }

        .footer {
            margin-top: 40px;
            font-size: 12px;
            opacity: 0.8;
        }

        @media (max-width: 600px) {
            h1 {
                font-size: 22px;
            }
            h2 {
                font-size: 16px;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Logo (optional) -->
        <!-- <img src="logo.png" class="logo" alt="College Logo"> -->

        <h1>GIRRAJ GOVERNMENT COLLEGE (Autonomous)</h1>
        <h2>Nizamabad</h2>

        <div class="subtitle">
            EXAMINATION BRANCH (U.G.) CBCS MAY-2025<br>
            RESULTS – AFTER REVALUATION
        </div>

        <div class="batch-buttons">
            <a href="#">2020 BATCH STUDENTS</a>
            <a href="#">2021 BATCH STUDENTS</a>
            <a href="#">2022 BATCH STUDENTS</a>
            <a href="#">2023 BATCH STUDENTS</a>
            <a href="#">2024 BATCH STUDENTS</a>
        </div>

        <div class="footer">
            © 2019 Girraj Govt. Degree College. All Rights Reserved
        </div>
    </div>

</body>
  </html>
